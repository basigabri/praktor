name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      - run: golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      - run: CGO_ENABLED=0 go test ./internal/... ./cmd/...

  # Short, time-boxed fuzzing of the parsers and handlers that face untrusted
  # input. The seed corpora also run as plain tests in the test job.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/container, name: FuzzContainerIDFromMountinfo }
          - { pkg: ./internal/container, name: FuzzMountinfoLine }
          - { pkg: ./internal/container, name: FuzzDecideAttach }
          - { pkg: ./internal/web, name: FuzzChatBody }
          - { pkg: ./internal/web, name: FuzzChatUnauthenticated }
          - { pkg: ./internal/router, name: FuzzRoute }
    name: fuzz (${{ matrix.target.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      - run: CGO_ENABLED=0 go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime=30s

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target.name }}
          path: '**/testdata/fuzz/${{ matrix.target.name }}/'
          if-no-files-found: ignore

  agent-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      - run: npm ci

      - run: npm run build

      - run: npm test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true

      - run: npm ci

      - run: npm run build

      - run: npm test
