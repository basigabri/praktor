name: Build Container Images

# Release build for this fork: publishes the gateway image only. The HA App
# pins it by digest and verifies its signature before using it.
#
# Hardening (see the security audit in the PR that introduced this):
# - actions pinned to commit SHAs; no permissions unless a job needs them;
# - the "release" environment requires the owner's approval;
# - no shared build cache (a cache written by another workflow can't end up
#   in a release);
# - provenance + SBOM attached, image signed keyless with cosign by digest;
# - no moving "latest" tag, and no automatic cleanup: the per-arch
#   manifests, signatures and attestations are untagged, and deleting
#   "untagged" versions would break the images the HA App pins.
#
# Verify a release:
#   cosign verify ghcr.io/basigabri/praktor@<digest> \
#     --certificate-identity-regexp '^https://github\.com/basigabri/praktor/\.github/workflows/build\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/basigabri/praktor@<digest> --repo basigabri/praktor

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-gateway:
    runs-on: ubuntu-latest
    needs: ci
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and attestations
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          no-cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image by digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: echo "ghcr.io/${GITHUB_REPOSITORY}:${TAG} = ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
